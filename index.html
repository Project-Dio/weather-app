<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/css/output.css" />
    <title>Document</title>
  </head>
  <body class="bg-blue-300 py-12">
    <main class="w-3/5">
      <!-- search bar -->
      <div class="container mx-auto px-4">
        <input
          type="text"
          class="block bg-white w-full rounded-sm p-2 mb-6"
          placeholder="Enter city name"
        />
        <div>
          <div
            id="latest-search"
            class="flex items-end [&>*:first-child]:w-1/4 [&>*:not(:first-child)]:flex-1 [&>*:not(:first-child)]:max-w-[20%] gap-3"
          >
            <figure>
              <img
                class="rounded-2xl mb-3"
                src="src/images/adam-kolmacka-DBpXFdO6_CU-unsplash.jpg"
                alt=""
              />
              <h2 class="text-xs text-center">Berlin, Germany</h2>
            </figure>
            <figure>
              <img
                class="rounded-lg mb-3"
                src="src/images/adam-kolmacka-DBpXFdO6_CU-unsplash.jpg"
                alt=""
              />
              <h2 class="text-xs text-center">Berlin, Germany</h2>
            </figure>
            <figure>
              <img
                src="src/images/adam-kolmacka-DBpXFdO6_CU-unsplash.jpg"
                alt=""
              />
              <h2>Berlin, Germany</h2>
            </figure>
          </div>
        </div>
      </div>
    </main>
    <aside class="w-2/5"></aside>
  </body>
</html>
